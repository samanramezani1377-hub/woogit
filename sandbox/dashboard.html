<!doctype html><meta charset="utf-8"><title>WooGit API Sandbox</title><style>body{font-family:system-ui;margin:24px;background:#f6f7f9}button{padding:8px 12px;margin:4px}table{width:100%;border-collapse:collapse;background:white}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}pre{white-space:pre-wrap;max-height:300px;overflow:auto}</style><h1>WooGit API Sandbox</h1><p>Use this page from the same machine as the sandbox server. It shows recorded API traffic.</p><p><button onclick="resetAll()">Reset data</button><button onclick="setMode(null)">Clear error</button><button onclick="setMode('500')">Next request: 500</button><button onclick="setMode('401')">Next request: 401</button><button onclick="setMode('403')">Next request: 403</button><button onclick="setMode('404')">Next request: 404</button><button onclick="setMode('409')">Next request: 409</button><button onclick="setMode('429')">Next request: 429</button><button onclick="setMode('timeout')">Next request: timeout</button><button onclick="setMode('malformed')">Next request: malformed JSON</button></p><table><thead><tr><th>Time</th><th>Method</th><th>Path</th><th>Status</th><th>ms</th><th>Request</th><th>Response</th></tr></thead><tbody id="rows"></tbody></table><script>async function api(p,o){return fetch(p,o)}async function setMode(mode){await api('/__sandbox__/error-mode',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode})});load()}async function resetAll(){await api('/__sandbox__/reset',{method:'POST'});load()}async function load(){const r=await api('/__sandbox__/requests');const x=await r.json();rows.innerHTML=x.slice().reverse().map(a=>`<tr><td>${a.timestamp}</td><td>${a.method}</td><td>${a.path}</td><td>${a.status}</td><td>${a.duration_ms}</td><td><pre>${esc(a.request_body)}</pre></td><td><pre>${esc(a.response_body)}</pre></td></tr>`).join('')}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}load();setInterval(load,2000)</script>
