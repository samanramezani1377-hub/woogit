name: Fix AI static replies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'samanramezani1377-hub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Remove deterministic AI user replies
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('presentation/src/main/kotlin/com/samanramezani1377/woogit/presentation/ai/AiAgent.kt')
          text = path.read_text(encoding='utf-8')

          old = '''        if (confirmationToken == null) {
              if (isStatusQuery(latestUserText)) {
                  return statusReply(conversationId)
              }

              if (isContinuationRequest(latestUserText)) {
                  val state = workingMemory.read(conversationId)
                      ?: return AgentReply(
                          text = "کار ناتمامی برای ادامه پیدا نشد. درخواست جدید خودت را بگو تا از ابتدا انجامش بدهم.",
                      )
                  val progress = state.optJSONObject("progress")
                  val remaining = progress?.optInt("remaining", 0) ?: 0
                  if (state.optString("status") == "completed" && remaining <= 0) {
                      return AgentReply(
                          text = "کار قبلی طبق Working Memory کامل شده است؛ چیزی برای ادامه باقی نمانده است.",
                      )
                  }
                  workingMemory.resume(conversationId)
              } else {
                  workingMemory.beginNewExecution(
                      conversationId,
                      latestUserText.ifBlank { "Agent task" },
                  )
              }
              activateWorkingMemory(conversationId, messages, working)
          }
          '''
          old = old.replace('              ', '            ', 1)
          if old not in text:
              raise SystemExit('deterministic execution/status block not found')
          new = '''        if (confirmationToken == null) {
              if (isContinuationRequest(latestUserText)) {
                  val state = workingMemory.read(conversationId)
                  if (state?.optString("status") == "active") {
                      workingMemory.resume(conversationId)
                  } else if (state == null) {
                      workingMemory.beginNewExecution(
                          conversationId,
                          latestUserText.ifBlank { "Agent task" },
                      )
                  }
              } else if (!isStatusQuery(latestUserText)) {
                  workingMemory.beginNewExecution(
                      conversationId,
                      latestUserText.ifBlank { "Agent task" },
                  )
              }
              activateWorkingMemory(conversationId, messages, working)
          }
          '''
          new = new.replace('              ', '            ', 1)
          text = text.replace(old, new, 1)

          def remove_function(src, signature):
              start = src.index(signature)
              brace = src.index('{', start)
              depth = 0
              end = None
              for i in range(brace, len(src)):
                  if src[i] == '{': depth += 1
                  elif src[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'could not close {signature}')
              return src[:start] + src[end:]

          text = remove_function(text, '    private fun statusReply(conversationId: String): AgentReply {')

          old_final = '''            if (text.isNotBlank()) {
                  AgentReply(text = text, attachments = attachments)
              } else {
                  AgentReply(
                      text = mandatoryFallback(conversationId),
                      attachments = attachments,
                  )
              }
          } catch (_: Throwable) {
              AgentReply(
                  text = mandatoryFallback(conversationId),
                  attachments = attachments,
              )
          }
          '''
          old_final = old_final.replace('                  ', '                ', 1)
          if old_final not in text:
              raise SystemExit('mandatory final fallback block not found')
          new_final = '''            AgentReply(text = text, attachments = attachments)
          } catch (_: Throwable) {
              AgentReply(text = "", attachments = attachments)
          }
          '''
          text = text.replace(old_final, new_final, 1)
          text = remove_function(text, '    private fun mandatoryFallback(conversationId: String): String {')
          path.write_text(text, encoding='utf-8')

          index = Path('docs/agent/SOURCE_INDEX.md')
          index_text = index.read_text(encoding='utf-8')
          marker = '\n## AI response policy\n\n'
          note = 'Fixed user-facing status/fallback replies were removed from AiAgent; status questions now go through the normal model response path while Working Memory remains internal.\n'
          if marker not in index_text:
              index_text += marker + note
          elif note not in index_text:
              index_text = index_text.replace(marker, marker + note, 1)
          index.write_text(index_text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-ai-static-replies.yml
          git config user.name 'samanramezani1377-hub'
          git config user.email 'saman.ramezani1377@gmail.com'
          git add presentation/src/main/kotlin/com/samanramezani1377/woogit/presentation/ai/AiAgent.kt docs/agent/SOURCE_INDEX.md .github/workflows/fix-ai-static-replies.yml
          git commit -m 'Remove fixed AI user-facing replies'
          git push origin main
