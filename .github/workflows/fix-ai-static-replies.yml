# One-time cleanup trigger
name: Fix AI static replies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove fixed AI replies
        shell: bash
        run: |
          echo "Cleanup is handled by the one-time CI cleanup job."
