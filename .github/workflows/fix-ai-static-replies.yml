name: Fix AI static replies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply AI response cleanup
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/cleanup.py
          python3 /tmp/cleanup.py
          git config user.name 'samanramezani1377-hub'
          git config user.email 'saman.ramezani1377@gmail.com'
          git add -A
          git commit -m 'Remove fixed AI user-facing replies'
          git push origin main
