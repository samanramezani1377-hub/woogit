name: Agent Map Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-map-sync:
    name: Verify App code → agent map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify synchronization
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            bash .github/agent-map-guard.sh "$BASE_SHA" "$GITHUB_SHA"
          else
            BASE=$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)
            if [[ -n "$BASE" ]]; then bash .github/agent-map-guard.sh "$BASE" "$GITHUB_SHA"; else echo 'Initial commit: no previous tree to compare.'; fi

  ai-static-cleanup:
    name: One-time AI static reply cleanup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run cleanup only when marker exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/AI_CLEANUP_TRIGGER ]]; then
            echo 'No cleanup marker; nothing to do.'
            exit 0
          fi
          python3 scripts/cleanup_ai_static_replies.py
          rm -f scripts/cleanup_ai_static_replies.py .github/AI_CLEANUP_TRIGGER
          git config user.name 'samanramezani1377-hub'
          git config user.email 'saman.ramezani1377@gmail.com'
          git add -A
          git commit -m 'Remove fixed AI user-facing replies'
          git push origin main
