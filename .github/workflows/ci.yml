name: WooGit V1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woogit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          adb version
          sdkmanager --list_installed | grep -E "platforms;android-${ANDROID_API_LEVEL}|build-tools;${ANDROID_BUILD_TOOLS}|platform-tools" || true

      - name: Build debug APK
        id: build_debug
        continue-on-error: true
        run: gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build_debug.log

      - name: Publish build errors to job summary
        if: steps.build_debug.outcome == 'failure'
        run: |
          {
            echo '### Build debug APK failed'
            echo '```'
            grep -E "^e: |error:|FAILURE|What went wrong|\* Where|\* What went wrong|Caused by|Execution failed" /tmp/build_debug.log | head -n 200
            echo '---- tail ----'
            tail -n 150 /tmp/build_debug.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Unit tests
        if: steps.build_debug.outcome == 'success'
        run: gradle test --stacktrace --no-daemon

      - name: Android lint
        if: steps.build_debug.outcome == 'success'
        run: gradle lint --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: woogit-debug-apk-${{ github.sha }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7
