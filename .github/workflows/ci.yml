name: WooGit V1 CI

on:
  push:
    branches: [main, app-transfer]
    paths-ignore:
      - 'docs/agent/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woogit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  debug-build:
    name: Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: on-success
      - name: Build debug
        run: gradle assembleDebug --console=plain --warning-mode=all --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: woogit-debug-apk-${{ github.sha }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7

  release-build:
    name: Signed release build and AAB verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: on-success
      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/woogit-release.jks"
          chmod 600 "${RUNNER_TEMP}/woogit-release.jks"
      - name: Build signed release APK and AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          gradle \
            -Pwoogit.release.keystore="${RUNNER_TEMP}/woogit-release.jks" \
            -Pwoogit.release.keystorePassword="${ANDROID_KEYSTORE_PASSWORD}" \
            -Pwoogit.release.keyAlias="${ANDROID_KEY_ALIAS}" \
            -Pwoogit.release.keyPassword="${ANDROID_KEY_PASSWORD}" \
            assembleRelease bundleRelease \
            --console=plain --warning-mode=all --stacktrace
      - name: Verify release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find . -type f -path '*/build/outputs/apk/**/*.apk' -size +0c | sort)
          mapfile -t aabs < <(find . -type f -path '*/build/outputs/bundle/**/*.aab' -size +0c | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No non-empty APK was produced by the signed release build."
            exit 1
          fi
          if (( ${#aabs[@]} == 0 )); then
            echo "No non-empty AAB was produced by the signed release build."
            exit 1
          fi
          printf 'Produced APKs:\n%s\n' "${apks[@]}"
          printf 'Produced AABs:\n%s\n' "${aabs[@]}"
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            ls -lh "$apk"
            sha256sum "$apk"
            if command -v apkanalyzer >/dev/null 2>&1; then
              apkanalyzer manifest application-id "$apk"
              apkanalyzer manifest version-code "$apk"
              apkanalyzer manifest version-name "$apk"
            elif command -v aapt2 >/dev/null 2>&1; then
              aapt2 dump packagename "$apk"
            else
              echo "No APK manifest inspection tool available on PATH."
              exit 1
            fi
          done
          for aab in "${aabs[@]}"; do
            echo "AAB: $aab"
            ls -lh "$aab"
            sha256sum "$aab"
            jarsigner -verify -verbose -certs "$aab" >/dev/null
            echo "AAB signature verification passed."
          done
      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: woogit-release-apk-${{ github.sha }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed release AAB
        uses: actions/upload-artifact@v6
        with:
          name: woogit-release-aab-${{ github.sha }}
          path: '**/build/outputs/bundle/**/*.aab'
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/woogit-release.jks"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install required Android SDK packages
        run: sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: on-success
      - name: Unit tests
        run: gradle test --continue --console=plain --warning-mode=all --stacktrace

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install required Android SDK packages
        run: sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: on-success
      - name: Android lint
        run: gradle lint --console=plain --warning-mode=all --stacktrace

  final-gate:
    name: Final CI gate
    if: always()
    needs: [debug-build, release-build, unit-tests, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to pass
        shell: bash
        env:
          DEBUG_RESULT: ${{ needs.debug-build.result }}
          RELEASE_RESULT: ${{ needs.release-build.result }}
          TEST_RESULT: ${{ needs.unit-tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          set -euo pipefail
          echo "Debug build : ${DEBUG_RESULT}"
          echo "Release AAB : ${RELEASE_RESULT}"
          echo "Unit tests  : ${TEST_RESULT}"
          echo "Lint        : ${LINT_RESULT}"
          if [[ "${DEBUG_RESULT}" != "success" || "${RELEASE_RESULT}" != "success" || "${TEST_RESULT}" != "success" || "${LINT_RESULT}" != "success" ]]; then
            echo "CI FAILED: one or more required validation jobs failed or were cancelled."
            exit 1
          fi
          echo "CI PASSED: debug/release builds, tests, lint and AAB verification are green."
