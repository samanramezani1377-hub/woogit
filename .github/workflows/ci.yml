name: WooGit V1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woogit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: always

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle --version | grep -F "Gradle ${GRADLE_VERSION}"
          adb version
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --list_installed | grep -E "platforms;android-${ANDROID_API_LEVEL}|build-tools;${ANDROID_BUILD_TOOLS}|platform-tools"

      - name: Compile debug (diagnostic)
        id: debug_compile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle assembleDebug --continue --console=plain --warning-mode=all --stacktrace --no-daemon 2>&1 | tee debug-ci.log
          status=${PIPESTATUS[0]}
          echo "Gradle exit code: ${status}"
          exit "${status}"

      - name: Compile release (diagnostic)
        id: release_compile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle assembleRelease --continue --console=plain --warning-mode=all --stacktrace --no-daemon 2>&1 | tee release-ci.log
          status=${PIPESTATUS[0]}
          echo "Gradle exit code: ${status}"
          exit "${status}"

      # Tests and lint are intentionally gated on compilation. Running them while
      # Kotlin compilation is broken mostly repeats the same compiler failures and
      # makes the diagnostic signal harder to read.
      - name: Unit tests
        id: tests
        if: steps.debug_compile.outcome == 'success' && steps.release_compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle test --continue --console=plain --warning-mode=all --stacktrace --no-daemon 2>&1 | tee test-ci.log
          status=${PIPESTATUS[0]}
          echo "Gradle exit code: ${status}"
          exit "${status}"

      - name: Android lint
        id: lint
        if: steps.debug_compile.outcome == 'success' && steps.release_compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle lint --continue --console=plain --warning-mode=all --stacktrace --no-daemon 2>&1 | tee lint-ci.log
          status=${PIPESTATUS[0]}
          echo "Gradle exit code: ${status}"
          exit "${status}"

      - name: Collect diagnostic summary and annotations
        if: always()
        shell: bash
        run: |
          set +e
          : > ci-diagnostic-summary.txt
          echo "# WooGit CI diagnostic summary" >> ci-diagnostic-summary.txt
          echo >> ci-diagnostic-summary.txt
          echo "Commit: ${GITHUB_SHA}" >> ci-diagnostic-summary.txt
          echo "Debug compile: ${{ steps.debug_compile.outcome }}" >> ci-diagnostic-summary.txt
          echo "Release compile: ${{ steps.release_compile.outcome }}" >> ci-diagnostic-summary.txt
          echo "Tests: ${{ steps.tests.outcome }}" >> ci-diagnostic-summary.txt
          echo "Lint: ${{ steps.lint.outcome }}" >> ci-diagnostic-summary.txt
          echo >> ci-diagnostic-summary.txt

          echo "## Compiler errors" >> ci-diagnostic-summary.txt
          grep -hE '^e: file:///.+:[0-9]+:[0-9]+ ' debug-ci.log release-ci.log 2>/dev/null | sort -u >> ci-diagnostic-summary.txt || true
          echo >> ci-diagnostic-summary.txt
          echo "## Compiler warnings" >> ci-diagnostic-summary.txt
          grep -hE '^w: file:///.+:[0-9]+:[0-9]+ ' debug-ci.log release-ci.log 2>/dev/null | sort -u >> ci-diagnostic-summary.txt || true
          echo >> ci-diagnostic-summary.txt
          echo "## Gradle reports" >> ci-diagnostic-summary.txt
          find . -type f \( -path '*/build/reports/*' -o -path '*/build/test-results/*' \) -print | sort >> ci-diagnostic-summary.txt

          # Convert only well-formed Kotlin compiler diagnostics to GitHub
          # annotations. Raw logs remain authoritative and are uploaded below.
          for log in debug-ci.log release-ci.log; do
            [[ -f "$log" ]] || continue
            grep -E '^e: file:///.+:[0-9]+:[0-9]+ ' "$log" | while IFS= read -r line; do
              payload="${line#e: file://${GITHUB_WORKSPACE}/}"
              if [[ "$payload" == "$line" ]]; then
                payload="${line#e: file:///home/runner/work/woogit/woogit/}"
              fi
              file_part="${payload%%:*}"
              rest="${payload#*:}"
              line_no="${rest%%:*}"
              rest="${rest#*:}"
              col_no="${rest%% *}"
              message="${rest#* }"
              if [[ -n "$file_part" && "$line_no" =~ ^[0-9]+$ && "$col_no" =~ ^[0-9]+$ ]]; then
                echo "::error file=${file_part},line=${line_no},col=${col_no}::${message}"
              fi
            done
          done

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: woogit-ci-diagnostics-${{ github.sha }}
          path: |
            *-ci.log
            ci-diagnostic-summary.txt
            '**/build/reports/**'
            '**/build/test-results/**'
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: always() && steps.debug_compile.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: woogit-debug-apk-${{ github.sha }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7

      - name: Final CI gate
        if: always()
        shell: bash
        env:
          DEBUG_OUTCOME: ${{ steps.debug_compile.outcome }}
          RELEASE_OUTCOME: ${{ steps.release_compile.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          set -euo pipefail
          echo "========================================"
          echo "WooGit V1 CI result"
          echo "========================================"
          echo "Debug compile   : ${DEBUG_OUTCOME}"
          echo "Release compile : ${RELEASE_OUTCOME}"
          echo "Tests           : ${TESTS_OUTCOME:-skipped}"
          echo "Lint            : ${LINT_OUTCOME:-skipped}"
          echo "========================================"
          if [[ "${DEBUG_OUTCOME}" != "success" || "${RELEASE_OUTCOME}" != "success" ]]; then
            echo "CI FAILED: one or more required compile variants failed."
            exit 1
          fi
          if [[ "${TESTS_OUTCOME:-skipped}" != "success" || "${LINT_OUTCOME:-skipped}" != "success" ]]; then
            echo "CI FAILED: tests or lint did not pass after compilation."
            exit 1
          fi
          echo "CI PASSED: compile, tests and lint are green."
