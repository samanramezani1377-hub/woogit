name: WooGit V1 CI

on:
  push:
    branches: [main, app-transfer]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woogit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  debug-build:
    name: Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: on-success
      - name: Build debug
        run: gradle assembleDebug --console=plain --warning-mode=all --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: woogit-debug-apk-${{ github.sha }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7

  release-build:
    name: Release build and APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: on-success
      - name: Build release
        run: gradle assembleRelease --console=plain --warning-mode=all --stacktrace
      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find . -type f -path '*/build/outputs/apk/**/*.apk' -size +0c | sort)
          if (( ${#apks[@]} == 0 )); then echo "No non-empty APK was produced by the release build."; exit 1; fi
          printf 'Produced APKs:\n%s\n' "${apks[@]}"
          for apk in "${apks[@]}"; do
            ls -lh "$apk"; sha256sum "$apk"
            if command -v apkanalyzer >/dev/null 2>&1; then apkanalyzer manifest application-id "$apk"; apkanalyzer manifest version-code "$apk"; apkanalyzer manifest version-name "$apk"; elif command -v aapt2 >/dev/null 2>&1; then aapt2 dump packagename "$apk"; else echo "No APK manifest inspection tool available on PATH."; exit 1; fi
          done
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: woogit-release-apk-${{ github.sha }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: ${{ env.JAVA_VERSION }} }
      - uses: android-actions/setup-android@v4
        with: { packages: platform-tools, accept-android-sdk-licenses: true, log-accepted-android-sdk-licenses: false }
      - run: sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: ${{ env.GRADLE_VERSION }}, cache-cleanup: on-success }
      - run: gradle test --console=plain --warning-mode=all --stacktrace

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: ${{ env.JAVA_VERSION }} }
      - uses: android-actions/setup-android@v4
        with: { packages: platform-tools, accept-android-sdk-licenses: true, log-accepted-android-sdk-licenses: false }
      - run: sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: ${{ env.GRADLE_VERSION }}, cache-cleanup: on-success }
      - run: gradle lint --console=plain --warning-mode=all --stacktrace
