name: WooGit V1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woogit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: always
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version | grep -F "Gradle ${GRADLE_VERSION}"
          adb version
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --list_installed | grep -E "platforms;android-${ANDROID_API_LEVEL}|build-tools;${ANDROID_BUILD_TOOLS}|platform-tools"
      - name: Build debug
        id: debug_build
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --console=plain --warning-mode=all --stacktrace --no-daemon 2>&1 | tee debug-ci.log
      - name: Build release
        id: release_build
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --console=plain --warning-mode=all --stacktrace --no-daemon 2>&1 | tee release-ci.log
      - name: Unit tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          gradle test --console=plain --warning-mode=all --stacktrace --no-daemon 2>&1 | tee test-ci.log
      - name: Android lint
        id: lint
        shell: bash
        run: |
          set -euo pipefail
          gradle lint --console=plain --warning-mode=all --stacktrace --no-daemon 2>&1 | tee lint-ci.log
      - name: Verify APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find . -type f -path '*/build/outputs/apk/**/*.apk' -size +0c | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No non-empty APK was produced by this build."
            exit 1
          fi
          printf 'Produced APKs:\n%s\n' "${apks[@]}"
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            ls -lh "$apk"
            sha256sum "$apk"
            if command -v apkanalyzer >/dev/null 2>&1; then
              apkanalyzer manifest application-id "$apk"
              apkanalyzer manifest version-code "$apk"
              apkanalyzer manifest version-name "$apk"
            elif command -v aapt2 >/dev/null 2>&1; then
              aapt2 dump packagename "$apk"
            else
              echo "No APK manifest inspection tool available on PATH."
              exit 1
            fi
          done
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: woogit-debug-apk-${{ github.sha }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7
      - name: Collect CI diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          : > ci-diagnostic-summary.txt
          {
            echo "# WooGit CI diagnostic summary"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Debug build: ${{ steps.debug_build.outcome }}"
            echo "Release build: ${{ steps.release_build.outcome }}"
            echo "Tests: ${{ steps.tests.outcome }}"
            echo "Lint: ${{ steps.lint.outcome }}"
            echo "APK verification: ${{ steps.verify_apk.outcome }}"
            echo
            echo "## Compiler errors"
          } >> ci-diagnostic-summary.txt
          for log in debug-ci.log release-ci.log test-ci.log lint-ci.log; do
            [[ -f "$log" ]] || continue
            grep -hE '^e: file:///.+:[0-9]+:[0-9]+ ' "$log" 2>/dev/null || true
          done | sort -u >> ci-diagnostic-summary.txt
          {
            echo
            echo "## Gradle reports"
            find . -type f \( -path '*/build/reports/*' -o -path '*/build/test-results/*' \) -print | sort
          } >> ci-diagnostic-summary.txt
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: woogit-ci-diagnostics-${{ github.sha }}
          path: |
            *-ci.log
            ci-diagnostic-summary.txt
            '**/build/reports/**'
            '**/build/test-results/**'
          if-no-files-found: warn
          retention-days: 14
      - name: Final CI gate
        if: always()
        shell: bash
        env:
          DEBUG_OUTCOME: ${{ steps.debug_build.outcome }}
          RELEASE_OUTCOME: ${{ steps.release_build.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          APK_OUTCOME: ${{ steps.verify_apk.outcome }}
        run: |
          set -euo pipefail
          echo "========================================"
          echo "WooGit V1 CI result"
          echo "========================================"
          echo "Debug build     : ${DEBUG_OUTCOME}"
          echo "Release build   : ${RELEASE_OUTCOME}"
          echo "Tests           : ${TESTS_OUTCOME}"
          echo "Lint            : ${LINT_OUTCOME}"
          echo "APK verification: ${APK_OUTCOME}"
          echo "========================================"
          if [[ "${DEBUG_OUTCOME}" != "success" || "${RELEASE_OUTCOME}" != "success" || "${TESTS_OUTCOME}" != "success" || "${LINT_OUTCOME}" != "success" || "${APK_OUTCOME}" != "success" ]]; then
            echo "CI FAILED: one or more required verification gates failed."
            exit 1
          fi
          echo "CI PASSED: build, tests, lint and APK verification are green."