name: WooGit Billing Lock UI Instrumentation

on:
  push:
    branches: [main, app-transfer]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-lock-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  subscription-screen-instrumentation:
    name: Expired subscription UI instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install emulator and Android platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" \
            "emulator" \
            "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64"
          echo "no" | avdmanager create avd \
            --force \
            --name billing-lock-test \
            --package "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64" \
            --device "pixel_2"

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator -avd billing-lock-test \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > /tmp/billing-lock-emulator.log 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | grep -m 1 "1"; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: on-success

      - name: Run expired subscription Compose UI test
        run: gradle :presentation:connectedDebugAndroidTest --console=plain --warning-mode=all --stacktrace

      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: billing-lock-emulator-log-${{ github.sha }}
          path: /tmp/billing-lock-emulator.log
          if-no-files-found: ignore
          retention-days: 7
