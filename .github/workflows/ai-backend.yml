name: WooGit AI Backend

on:
  push:
    paths:
      - "ai-backend/**"
      - ".github/workflows/ai-backend.yml"
  pull_request:
    paths:
      - "ai-backend/**"
      - ".github/workflows/ai-backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-backend/package.json
      - run: npm install
      - run: npm run build
