name: Apply AI stop generation patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Implement AI generation stop control'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generation cancellation and stop button
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vm = Path('presentation/src/main/kotlin/com/samanramezani1377/woogit/presentation/ai/AiViewModel.kt')
          s = vm.read_text()
          s = s.replace('import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.flow.MutableStateFlow', 'import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.Job\nimport kotlinx.coroutines.flow.MutableStateFlow')
          s = s.replace('    private var currentSessionId: String = initialSession?.id ?: historyStore.newSessionId()\n', '    private var currentSessionId: String = initialSession?.id ?: historyStore.newSessionId()\n    private var generationJob: Job? = null\n')
          marker = '    fun reject(pending: AgentReply) {\n'
          insert = '''    fun stopGeneration() {\n        val working = _state.value as? AiUiState.Working ?: return\n        val completedMessages = if (working.streamingText.isBlank()) {\n            working.messages\n        } else {\n            working.messages + AiMessage("assistant", working.streamingText)\n        }\n        generationJob?.cancel()\n        generationJob = null\n        historyStore.saveSession(currentSessionId, completedMessages)\n        refreshHistory()\n        _state.value = AiUiState.Ready(completedMessages)\n    }\n\n'''
          if 'fun stopGeneration()' not in s:
              s = s.replace(marker, insert + marker)
          old = '''        viewModelScope.launch(Dispatchers.IO) {\n            try {'''
          new = '''        generationJob = viewModelScope.launch(Dispatchers.IO) {\n            try {'''
          if old not in s:
              raise SystemExit('AiViewModel launch marker not found')
          s = s.replace(old, new, 1)
          old_catch = '''            } catch (error: Throwable) {\n                historyStore.saveSession(currentSessionId, messages)\n                refreshHistory()\n                _state.value = AiUiState.Error(messages, error.message ?: "ارتباط با سرویس AI ناموفق بود.")\n            }\n        }\n'''
          new_catch = '''            } catch (error: CancellationException) {\n                // User pressed Stop; preserve the partial response and do not show an error.\n            } catch (error: Throwable) {\n                historyStore.saveSession(currentSessionId, messages)\n                refreshHistory()\n                _state.value = AiUiState.Error(messages, error.message ?: "ارتباط با سرویس AI ناموفق بود.")\n            } finally {\n                generationJob = null\n            }\n        }\n'''
          if old_catch not in s:
              raise SystemExit('AiViewModel catch marker not found')
          s = s.replace(old_catch, new_catch, 1)
          vm.write_text(s)

          screen = Path('presentation/src/main/kotlin/com/samanramezani1377/woogit/presentation/ai/AiScreen.kt')
          s = screen.read_text()
          old = '''                    IconButton(onClick = { vm.send(input); input = "" }, enabled = (input.isNotBlank() || attachments.isNotEmpty()) && state !is AiUiState.Working && apiKey.isNotBlank()) { Box(Modifier.size(44.dp).clip(CircleShape).background(GlassTokens.accent), contentAlignment = Alignment.Center) { Text("↑", color = Color.White, fontWeight = FontWeight.Bold) } }'''
          new = '''                    if (state is AiUiState.Working) {\n                        IconButton(onClick = vm::stopGeneration) {\n                            Box(Modifier.size(44.dp).clip(CircleShape).background(GlassTokens.accent), contentAlignment = Alignment.Center) {\n                                Box(Modifier.size(15.dp).clip(RoundedCornerShape(3.dp)).background(Color.White))\n                            }\n                        }\n                    } else {\n                        IconButton(onClick = { vm.send(input); input = "" }, enabled = (input.isNotBlank() || attachments.isNotEmpty()) && apiKey.isNotBlank()) {\n                            Box(Modifier.size(44.dp).clip(CircleShape).background(GlassTokens.accent), contentAlignment = Alignment.Center) { Text("↑", color = Color.White, fontWeight = FontWeight.Bold) }\n                        }\n                    }'''
          if old not in s:
              raise SystemExit('AiScreen send button marker not found')
          s = s.replace(old, new, 1)
          screen.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentation/src/main/kotlin/com/samanramezani1377/woogit/presentation/ai/AiViewModel.kt presentation/src/main/kotlin/com/samanramezani1377/woogit/presentation/ai/AiScreen.kt
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Implement AI generation stop control'
          git push
      - name: Remove one-shot patch workflow
        if: success()
        run: |
          git rm .github/workflows/apply-ai-stop-patch.yml
          git commit -m 'Remove one-shot AI stop patch workflow'
          git push
