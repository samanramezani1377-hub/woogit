name: One-time Customers compile repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-customers-compile-fix.yml'
      - 'presentation/src/main/kotlin/com/samanramezani1377/woogit/presentation/commerce/CustomersPage.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair CustomersPage source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('presentation/src/main/kotlin/com/samanramezani1377/woogit/presentation/commerce/CustomersPage.kt')
          text = path.read_text(encoding='utf-8')
          old_address = 'Address(city = city.trim())'
          new_address = 'Address(firstName = null, lastName = null, company = null, address1 = null, address2 = null, city = city.trim(), state = null, postcode = null, country = null, phone = phone.trim().takeIf { it.isNotBlank() })'
          old_error = 'is DomainError.Validation -> message ?: "اطلاعات مشتری نامعتبر است."'
          new_error = 'is DomainError.Validation -> reason'
          if old_address not in text:
              raise SystemExit('Expected Address constructor not found')
          if old_error not in text:
              raise SystemExit('Expected DomainError.Validation mapping not found')
          text = text.replace(old_address, new_address, 1)
          text = text.replace(old_error, new_error, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/one-time-customers-compile-fix.yml
          git add presentation/src/main/kotlin/com/samanramezani1377/woogit/presentation/commerce/CustomersPage.kt .github/workflows/one-time-customers-compile-fix.yml
          git commit -m '[ci-fix] Repair Customers source compile errors'
          git push origin HEAD:main